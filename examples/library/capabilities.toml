# Capability vocabulary for matching requirements to bullets: domains with their capabilities, each
# domain's topic tag, and the family or families it sits in.

about = '''
Domains are broad fields of work, and each holds capabilities: specific things a person can show they
have done. Model call 2 labels each requirement of a posting with capabilities from this
list, and each bullet in `projects.toml` lists the capabilities it demonstrates; a requirement counts as
met once a bullet on the page demonstrates a capability it was labelled with. Capabilities that no bullet
demonstrates are the library's gaps and count as unmet.

Saved posting mappings are tied to a hash of the (capability, domain) pairs. Renaming a capability or
moving it to another domain changes the hash, and each saved mapping is then redone the next time its
posting is read. Changing only the notes leaves the hash alone.'''
domains_notes = '''
Conditions are kept apart from capabilities. A language, tool, platform, degree or years of experience
("in Go", "Kubernetes", "Bachelor's degree", "5+ years") is a condition checked on its own, never a way
to satisfy the capability it qualifies.'''
families_notes = '''
Families are the coarsest grouping: Security, AI and data, Software, Systems and Professional. Each domain
belongs to one family, except AI security, which belongs to both Security and AI and data. On a given
posting, a project whose capabilities fall mostly in the families that posting wants receives a small
multiplier on its standing.'''

[[domain]]
name = "Offensive security"
tag = "sec.offensive"
families = ["Security"]
capabilities = [
  "vulnerability research", "exploit development", "web and API security",
  "infrastructure and network penetration testing", "OS and endpoint security", "smart contract security",
  "red team operations", "security test automation",
]

