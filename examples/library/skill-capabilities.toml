# Capability names (as spelled in capabilities.toml) demonstrated by every skill and course; the engine
# matches a posting's requirements against these entries.

about = '''
List one capability per entry where possible, the most representative first. For a given requirement, a
skill counts fully if the requirement names it outright ("Python", "Burp Suite") or wants a capability
listed for it, and partly if the requirement wants a different capability from the same domain. Plain
languages and tools that postings only ever request by name get an empty list and are matched on their
names. Courses work likewise; a course also counts fully when its title states a condition the requirement
names.

Missing entries fall back to matching by name, and loading the library prints a warning for each. The fixed
certifications row is printed unchanged and needs no entry. Skills that appear in two rows are listed
once.'''

