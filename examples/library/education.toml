# The two degrees, top to bottom as printed. Only the course lists vary from posting to posting.

about = '''
Both degrees appear on every page. Under each, the engine prints a course list picked for the posting: at
most eleven courses, ranked first by how much of the posting's requirement weight they answer (through
`skill-capabilities.toml`) and then by topic fit. Each degree must list eight courses or more.

The Word template prints the institution, award, dates and `fixed` line itself, so edit them there as well
as here. The `fixed` line appears on every page and can meet a condition a posting names. `names` holds
alternative wordings a posting may use for the degree, such as "bachelor's degree"; they satisfy a degree
requirement without steering the topic mix, which `evidence` words do.'''

[[degree]]  # located in Denver, Colorado
id = "halvorsen"
institution = "Halvorsen Institute of Technology"
award = "Master of Science in Cybersecurity"
dates = "Sep 2024 – May 2026"
evidence = ["cybersecurity", "information security", "security engineering", "computer security"]
names = [
  "master's degree", "master's", "Master of Science", "MS in Cybersecurity", "graduate degree", "advanced degree",
]
fixed = "Graduate Research Assistant, Applied Security Lab"
note = "The template prints the research assistant line, dated January 2025 to May 2026, below this degree."
courses = [
  { text = "Software Security", tags = { "security.appsec" = 0.7, "security.offensive" = 0.3 } },
  { text = "Machine Learning Security", tags = { "ai.adversarial" = 0.6, "ai.security" = 0.4 } },
  { text = "Large Language Model Security", tags = { "ai.security" = 0.8, "ai.agents" = 0.2 } },
  { text = "Cloud Security", tags = { "security.appsec" = 0.6, "software.backend" = 0.4 } },
  { text = "Applied Cryptography", tags = { "security.appsec" = 0.6, research = 0.4 } },
  { text = "Network Security", tags = { "systems.networking" = 0.6, "security.appsec" = 0.4 } },
  { text = "Malware Analysis", tags = { "security.forensics" = 0.6, "reverse-engineering" = 0.4 } },
  { text = "Reverse Engineering", tags = { "reverse-engineering" = 0.8, "security.offensive" = 0.2 } },
  { text = "Incident Response and Forensics", tags = { "security.forensics" = 1.0 } },
  { text = "Operating Systems Security", tags = { "systems.os" = 0.6, "security.appsec" = 0.4 } },
  { text = "Security Risk Management", tags = { "security.grc" = 1.0 } },
  { text = "Privacy Engineering", tags = { "security.grc" = 0.6, "security.appsec" = 0.4 } },
  { text = "Security Metrics and Measurement", tags = { research = 0.6, "security.grc" = 0.4 } },
