# Candidate skill rows for the skills section, each with alternative titles and a pool of skills.

about = '''
The page has five chosen skill rows plus the certifications line. Seven rows here compete for those five
slots; for each posting the engine decides which rows win, the title each row is printed under, and up to
eight skills per row, drawing only on what is written below.

Burp Suite and Docker sit in two rows each. Whichever row is printed frames the skill; no skill is printed
twice. `prior`, between 0 and 1, is a row's value independent of the posting: it settles ties, and it
chooses rows when nothing in the posting points at any of them. When the `tools` row is chosen it is
printed last.

Each skill here is demonstrated by some bullet in `projects.toml`, and each skill in a competing row is
listed in `skill-capabilities.toml`. The `certs` row is printed by the Word template as fixed text, so its
wording has to match the template's certifications line exactly.'''

