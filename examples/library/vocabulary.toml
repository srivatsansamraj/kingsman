# Topic tags for every bullet, skill and course, and the cross-family pairs treated as neighbours.

about = '''
The fixed set of topic tags. Bullets, skills, skill-row titles and courses are tagged only from this set,
with each entry's weights adding up to 1. Tags record what a piece of work is about. The engine uses them
to judge the balance of themes on a page and to order skill-row titles and courses. Meeting requirements
is left to capabilities (`capabilities.toml`).

The text before the dot in a tag name is its family, so `security.appsec` and `security.offensive` count as
neighbours. The tag `research` must exist, because it is attached to every degree. Renaming or deleting a
tag requires retagging every entry that carries it.'''
adjacency_notes = '''
Tag pairs from different families that are still treated as neighbours when topics are compared (distance
1 rather than 2).'''

