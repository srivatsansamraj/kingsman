# Example library: project records for a fictional candidate. The engine reads the fields below; labels,
# remarks and source lines serve human readers only, and a note flagged private stays on this computer.

about = '''
Example data for a made-up candidate, Robin Kestrel, who completed a master's in cybersecurity in May 2026
after two internships. The people, schools and employers are invented, as is every figure; each `source`
line points at an imaginary document, to show how a real library records the origin of a claim.

What the example covers: work in all five capability families; a project still running (G2); one old
enough that its age discount bottoms out (O1); weak projects that alone hold some capability (O1 for data
analysis, U2 for Android); a held project (P1); a fragile bullet (G5.2); a pending bullet (G4.4); an
`excludes` pair giving two wordings of one result (I1.4 and I1.5); bullets carrying a liability (G2.3,
U2.2); a bullet that lists no capability (U1.1); a private note (I1); and a note about a repository, which
the judge's filter leaves out (G2).

Id scheme: I for internships, G for graduate work, U for undergraduate work, P for personal projects, O
for the oldest work; bullet ids add a dot and a number to the project id. On each bullet, `capabilities`
lists what the bullet demonstrates, strongest first, and `conditions` the languages, tools and platforms
it proves. `summary` and `facts` must each fit on one line, because model call 3 receives them with the
title and end date.'''

